<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <a href="#">Acme Support</a>
        <nav>
            <a href="#">Home</a>
            <a href="#">Help</a>
            <a href="#">Contact</a>
        </nav>
        <hr>
    </header>
    <main>
        <h1>Contact us</h1>
        <p>Send us a message and we will contact you</p>
        <form action="#" method="post">
            <fieldset>
                <p>
                    <label for="name">Full name</label>
                    <input type="text" name="name" id="name" required>
                </p>
                <p>
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" required>
                </p>
                <p>
                    <label for="subject">Subject</label>
                    <select name="subject" id="subject">
                        <option value="subject">lorem</option>
                        <option value="subject">ipsum</option>
                        <option value="subject">dolor</option>
                    </select>
                </p>
                <p>
                    <label for="message">Message</label>
                    <textarea name="message" id="message" cols="40" rows="6" required minlength="15"></textarea>
                </p>
            </fieldset>
            <fieldset>
                <legend>How did you hear about us?</legend>
                <p>
                    <input type="radio" name="source" id="source-search" value="search" checked>
                    <label for="source-search">Search</label>
                </p>
                <p>
                    <input type="radio" name="source" id="source-friend" value="friend">
                    <label for="source-friend">Friend</label>
                </p>
                <p>
                    <input type="radio" name="source" id="source-social" value="social">
                    <label for="source-social">Social Media</label>
                </p>
                <p>
                    <input type="radio" name="source" id="source-other" value="other">
                    <label for="source-other">Other</label>
                </p>
            </fieldset>
            <p>
                <input type="checkbox" name="newsletter" id="newsletter" value="yes">
                <label for="newsletter">Send me product updates</label>
            </p>
            <button type="submit">Send message</button>
        </form>
    </main>
</body>

</html>
